name: Validate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job's name is the check main's protection requires: renaming it
  # unprotects main.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every branch and tag, for the history check
        run: git fetch --quiet --tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: The manifests agree, the paths exist, the history names only ShipStatic
        run: python3 scripts/validate.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Claude Code reads the plugin and its marketplace
        # Exact-pinned: the validator carries Claude Code's contract, and a
        # floating pin would change what this check means between two runs.
        # One warning is expected and allowed: Claude Code does not load a
        # plugin's root CLAUDE.md, which is this repo's own guidance, never
        # the plugin's.
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.303
          claude plugin validate . --json > report.json || { cat report.json; exit 1; }
          jq -e '.success' report.json > /dev/null || { cat report.json; exit 1; }
          unexpected=$(jq '[.manifest.warnings[], (.contents[].warnings[] | select(.message | startswith("CLAUDE.md at the plugin root") | not))] | length' report.json)
          [ "$unexpected" -eq 0 ] || { cat report.json; exit 1; }

  notify:
    needs: [validate]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Post to the alerts channel
        env:
          ALERTS_WEBHOOK: ${{ secrets.ALERTS_WEBHOOK }}
        run: |
          MESSAGE="🔴 plugin validate failed on $GITHUB_REF_NAME"
          [ -n "$ALERTS_WEBHOOK" ] || { echo "::error::ALERTS_WEBHOOK is not set on this repository, so this outcome reached nobody"; exit 1; }
          curl --fail-with-body -sS --form-string "content=$MESSAGE <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID>" "$ALERTS_WEBHOOK"
