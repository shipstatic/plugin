name: Validate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job's name is the check main's protection requires: renaming it
  # unprotects main.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Claude Code reads the plugin as the Claude directory does
        # Exact-pinned: the validator carries Claude Code's contract, and a
        # floating pin would change what this check means between two runs.
        # The directory profile fails on anything the directory would refuse
        # among the checks this validator runs, and on a check it could not
        # make; --strict fails on any warning. The directory runs more
        # checks, such as its policy stage, so a green run here is not the
        # directory's verdict. Its findings are printed either way, so a
        # hold or a note shows in the log. The package's own checks (one
        # name, one version, one URL, the shape, the file list, the history)
        # run outside this repo, before a release: the plugin is text,
        # since the directory accepts a file that runs only from a
        # Verified organization.
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.319
          code=0
          claude plugin validate . --strict --profile directory --json > report.json || code=$?
          jq '.directory.findings' report.json || true
          [ "$code" -eq 0 ] || { cat report.json; exit 1; }

  notify:
    needs: [validate]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Post to the alerts channel
        env:
          ALERTS_WEBHOOK: ${{ secrets.ALERTS_WEBHOOK }}
        run: |
          MESSAGE="🔴 plugin validate failed on $GITHUB_REF_NAME"
          [ -n "$ALERTS_WEBHOOK" ] || { echo "::error::ALERTS_WEBHOOK is not set on this repository, so this outcome reached nobody"; exit 1; }
          curl --fail-with-body -sS --form-string "content=$MESSAGE <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID>" "$ALERTS_WEBHOOK"
