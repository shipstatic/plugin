name: Validate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job's name is the check main's protection requires: renaming it
  # unprotects main.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every branch and tag, for the history check
        run: git fetch --quiet --tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: The manifests agree, the paths exist, the history names only ShipStatic
        env:
          HISTORY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/validate.py

      - name: Each of those checks refuses the defect it names
        run: python3 scripts/validate_test.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Claude Code reads the plugin as the Claude directory does
        # Exact-pinned: the validator carries Claude Code's contract, and a
        # floating pin would change what this check means between two runs.
        # The directory profile fails on anything the directory would refuse
        # among the checks this validator runs, and on a check it could not
        # make; --strict fails on any warning, and none is allowed. The
        # directory runs more checks, such as its policy stage, so a green
        # run here is not the directory's verdict. Its findings are printed
        # either way, so a hold or a note shows in the log.
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.319
          code=0
          claude plugin validate . --strict --profile directory --json > report.json || code=$?
          jq '.directory.findings' report.json
          [ "$code" -eq 0 ] || { cat report.json; exit 1; }

  notify:
    needs: [validate]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Post to the alerts channel
        env:
          ALERTS_WEBHOOK: ${{ secrets.ALERTS_WEBHOOK }}
        run: |
          MESSAGE="🔴 plugin validate failed on $GITHUB_REF_NAME"
          [ -n "$ALERTS_WEBHOOK" ] || { echo "::error::ALERTS_WEBHOOK is not set on this repository, so this outcome reached nobody"; exit 1; }
          curl --fail-with-body -sS --form-string "content=$MESSAGE <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID>" "$ALERTS_WEBHOOK"
