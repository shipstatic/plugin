schema_version: "1.1"
name: password
description: A private site uses the built-in password, made up by the agent and given to the user.
tags: [decide, report]
expected_outcome: The site goes up behind ShipStatic's password with a made-up password of letters and numbers, and the reply gives it.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "Publish the dist folder, but only my team should be able to see it."
graders:
  - name: built-in-password
    type: tool_used
    tool: mcp__plugin_shipstatic_shipstatic__deployments_upload
    input_match: '"password":"[A-Za-z0-9]{8,}"'
    min: 1
  - name: no-password-page
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: gives-the-password
    type: llm
    criteria: The reply says visitors are asked for a password before they see anything, gives the password it set, and gives the link and the claim link. It shows no command line.
