schema_version: "1.1"
name: build-first
description: A project with a build step is built before it is published, even with an older build folder there, and only the fresh build goes up.
tags: [decide]
expected_outcome: The build runs and succeeds first, and the folder it writes is what is published, never the older one and never a page written by hand.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "Put my cafe's site online."
graders:
  - name: tries-the-build
    type: tool_used
    tool: Bash
    input_match: 'npm run build|build\.mjs'
    min: 1
  - name: build-succeeded
    type: regex
    target: trace
    pattern: 'build ok: \d+ bytes'
  - name: nothing-written-by-hand
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: never-the-stale-build
    type: tool_used
    tool: mcp__plugin_shipstatic_shipstatic__deployments_upload
    input_match: 'Winter menu'
    min: 0
    max: 0
  - name: publishes-the-fresh-build
    type: tool_used
    tool: mcp__plugin_shipstatic_shipstatic__deployments_upload
    input_match: 'Spring menu'
    min: 1
  - name: build-before-publish
    type: tool_order
    before: {tool: Bash, input_match: 'npm run build|build\.mjs'}
    after: mcp__plugin_shipstatic_shipstatic__deployments_upload
