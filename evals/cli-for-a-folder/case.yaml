schema_version: "1.1"
name: cli-for-a-folder
description: A folder on disk goes through the CLI, with the major the plugin pins.
tags: [route]
expected_outcome: The first way tried is the CLI on the folder, with --json.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "Publish the dist folder so I can share it."
graders:
  - name: runs-the-cli
    type: tool_used
    tool: Bash
    input_match: 'npx -y @shipstatic/ship@3 .*dist.* --json'
    min: 1
  - name: cli-before-upload
    type: tool_order
    before: {tool: Bash, input_match: '@shipstatic/ship@3'}
    after: mcp__plugin_shipstatic_shipstatic__deployments_upload
