schema_version: "1.1"
name: large-build
description: A large build the CLI can't send is never read into the conversation.
tags: [route]
expected_outcome: Nothing is uploaded; the reply says what is missing and gives one step to fix it.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "Publish the dist folder with our wedding photos."
graders:
  - name: no-inline-upload
    type: tool_used
    tool: mcp__plugin_shipstatic_shipstatic__deployments_upload
    min: 0
    max: 0
  - name: says-what-is-missing
    type: llm
    focus: trace
    criteria: The last reply tells the user in plain words that the photos are not online yet and gives one step that would fix it. It gives no link to a published site.
