schema_version: "1.1"
name: server-app
description: An app that needs its own server is not published.
tags: [decide]
expected_outcome: Nothing is published; the reply says the app needs a server ShipStatic doesn't run and offers a version that runs in the browser.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "Publish my todo app online so my team can use it."
graders:
  - name: no-upload
    type: tool_used
    tool: mcp__plugin_shipstatic_shipstatic__deployments_upload
    min: 0
    max: 0
  - name: no-cli
    type: tool_used
    tool: Bash
    input_match: '@shipstatic/ship'
    min: 0
    max: 0
  - name: declines-in-plain-words
    type: llm
    criteria: The reply says this app needs its own server (for its data or API), that ShipStatic publishes sites that run in the browser, and offers to make a version that works without a server or to change the project, asking before changing it. It does not claim the app was published.
